function codeHTML(lesson){const current=Object.prototype.hasOwnProperty.call(state.drafts,lesson.id)?state.drafts[lesson.id]:lesson.starter;
 return `<section class="editor-card" aria-label="Python code editor"><div class="editor-top"><div class="editor-label"><span class="py-icon">Py</span> mission.py</div><div class="editor-tools"><button class="mini-button" data-reset-code title="Reset to starter code">↻ Reset</button><button class="mini-button" data-copy-code title="Copy your code">⧉ Copy</button></div></div><div class="editor-body"><div class="line-numbers" id="line-numbers" aria-hidden="true">1</div><textarea id="code-editor" class="code-input" aria-label="Write Python code here" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off">${escapeHTML(current)}</textarea></div><div class="editor-footer"><span class="hint-text">⌨ Ctrl / ⌘ + Enter to run</span><div class="editor-buttons"><button id="run-btn" class="secondary" data-run ${state.running?'disabled':''}>▶ Run code</button><button id="check-btn" class="primary" data-check ${state.running?'disabled':''}>✓ Check answer</button></div></div></section><section class="console-card"><div class="console-head"><span>▣ &nbsp; OUTPUT CONSOLE</span><span id="console-state">Ready</span></div><div id="console-output" class="console-content">&gt; Click Run code to see what happens.</div></section>`;
}
function quizHTML(lesson){return `<section class="quiz-card"><div class="card-kicker">⚔️ &nbsp; Knowledge battle</div><h2>${escapeHTML(lesson.question).replace(/\n/g,'<br>')}</h2>${lesson.options.map((o,i)=>`<button class="option ${state.selectedOption===i?'selected':''} ${state.checked && i===lesson.answer?'correct':''} ${state.checked&&state.selectedOption===i&&i!==lesson.answer?'wrong':''}" data-option="${i}" ${state.checked&&state.completed.has(lesson.id)?'disabled':''}><span class="option-letter">${'ABCD'[i]}</span><span>${escapeHTML(o)}</span></button>`).join('')}<div class="quiz-footer"><span class="quiz-note">Pick one answer. No pressure!</span><button class="primary" data-submit-quiz ${state.selectedOption===null?'disabled':''}>✓ Submit answer</button></div></section>`;}
function feedbackHTML(data){return `<div class="feedback ${data.kind}"><span>${data.kind==='ok'?'✓':data.kind==='no'?'✕':'ⓘ'}</span><span>${escapeHTML(data.message)}</span></div>`;}
function nextButtonHTML(){let next=state.active+1;return next<LESSONS.length?`<button class="primary next-inline" data-mission="${next}">Next mission → ${escapeHTML(LESSONS[next].title)}</button>`:`<button class="primary next-inline" data-home>🏆 Return to the world map</button>`;}
function updateLines(){const editor=$('code-editor'),line=$('line-numbers');if(!editor||!line)return;line.textContent=Array.from({length:Math.max(1,editor.value.split('\n').length)},(_,i)=>i+1).join('\n');line.scrollTop=editor.scrollTop;}
function showOutput(){ const el=$('console-output');if(!el)return;el.className='console-content'+(state.feedback&&state.feedback.kind==='no'?' error':state.feedback&&state.feedback.kind==='ok'?' success':'');el.textContent=state.output||'> Click Run code to see what happens.';const tag=$('console-state');if(tag)tag.textContent=state.running?'Running...':state.feedback&&state.feedback.kind==='ok'?'Tests passed':state.feedback&&state.feedback.kind==='no'?'Needs fixing':'Ready'; }
function updateFeedback(data){state.feedback=data;const existing=document.querySelector('.workspace .feedback');if(existing)existing.remove();const workspace=document.querySelector('.workspace');if(workspace&&data){const item=document.createElement('div');item.className=`feedback ${data.kind}`;item.innerHTML=`<span>${data.kind==='ok'?'✓':data.kind==='no'?'✕':'ⓘ'}</span><span>${escapeHTML(data.message)}</span>`;workspace.appendChild(item);}showOutput();}
function completeLesson(lesson){if(state.completed.has(lesson.id)){updateFeedback({kind:'ok',message:'Perfect! You have already completed this mission. Feel free to experiment.'});return;}state.completed.add(lesson.id);const reward=Math.round(lesson.xp*(state.assisted[lesson.id] ? .4:1));persist();render();victory(lesson,reward);}
function victory(lesson,reward){const finished=state.completed.size===LESSONS.length;const next=state.active+1;$('overlay').innerHTML=`<div class="modal-shade" role="dialog" aria-modal="true" aria-labelledby="win-title"><div class="modal"><div class="modal-icon">${finished?'🏆':'🎉'}</div><div class="eyebrow">${finished?'ACADEMY COMPLETED':'MISSION COMPLETE'}</div><h2 id="win-title">${finished?'Python champion!':'Quest cleared!'}</h2><p>${finished?'You finished all 16 missions across all 4 worlds. Your journey into real programming is just beginning.':'You beat '+escapeHTML(lesson.title)+'! Your Python skills just got stronger.'}</p><div class="big-xp">⚡ +${reward} XP</div><div class="modal-buttons"><button class="secondary" data-close-modal>Stay here</button><button class="primary" ${next<LESSONS.length?'data-next-modal="'+next+'"':'data-home'}>${finished?'🏠 World map':'Next quest →'}</button></div></div></div>`;sprinkle();}
function sprinkle(){if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<16;i++){const el=document.createElement('div');el.className='floating-cloud';el.textContent=['✦','✨','⚡','✧'][i%4];el.style.left=Math.random()*95+'vw';el.style.top=(60+Math.random()*40)+'vh';el.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}}
function checkQuiz(){const lesson=LESSONS[state.active];if(state.selectedOption===null)return;state.checked=true;if(state.selectedOption===lesson.answer){completeLesson(lesson);}else{state.feedback={kind:'no',message:'Not quite! '+lesson.explanation};render();}}
// One single Web Worker hosts an actual Python interpreter. Terminating the worker breaks infinite loops safely.
function pythonWorkerMain(){
  let pyodide=null;
  self.onmessage=async function(event){
    const message=event.data;
    if(message.type==='init'){
      try {importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');pyodide=await loadPyodide();self.postMessage({type:'ready'});}
      catch(error){self.postMessage({type:'init_error',error:String(error)});}
      return;
    }
    if(message.type!=='run')return;
    if(!pyodide){self.postMessage({type:'result',id:message.id,error:'Python is not loaded yet.'});return;}
    const harness=String.raw`
import io, contextlib, traceback, json
namespace = {'__name__': '__main__'}
stream = io.StringIO()
error_message = None
try:
    with contextlib.redirect_stdout(stream), contextlib.redirect_stderr(stream):
        exec(compile(user_code, '<your code>', 'exec'), namespace)
except BaseException:
    error_message = traceback.format_exc(limit=4)
if error_message is None and test_code:
    namespace['__output__'] = stream.getvalue()
    namespace['__code__'] = user_code
    try:
        exec(compile(test_code, '<mission checks>', 'exec'), namespace)
    except AssertionError as e:
        error_message = 'Mission check failed: ' + (str(e) or 'One of the checks failed.')
    except BaseException:
        error_message = traceback.format_exc(limit=3)
json.dumps({'output': stream.getvalue()[:6000], 'error': error_message, 'success': error_message is None})
`;
    try {pyodide.globals.set('user_code',message.code);pyodide.globals.set('test_code',message.tests||'');const result=JSON.parse(await pyodide.runPythonAsync(harness));self.postMessage({type:'result',id:message.id,...result});}
    catch(error){self.postMessage({type:'result',id:message.id,output:'',success:false,error:String(error)});}
  };
}
let pythonWorker=null,pythonReady=false,pythonFailed=false,requestId=0,pending=null,workerUrl=null;
function setEngine(label,status){const dot=$('engine-dot');dot.className='engine-dot '+(status||'');$('engine-label').textContent=label;}
function startPython(){
  pythonReady=false;pythonFailed=false;setEngine('Python loading','');
  if(pythonWorker)pythonWorker.terminate();if(workerUrl)URL.revokeObjectURL(workerUrl);
  try{
    workerUrl=URL.createObjectURL(new Blob(['('+pythonWorkerMain.toString()+')()'],{type:'application/javascript'}));
    pythonWorker=new Worker(workerUrl);
    pythonWorker.onmessage=event=>{
      const data=event.data;
      if(data.type==='ready'){pythonReady=true;setEngine('Python ready','ready');return;}
      if(data.type==='init_error'){pythonFailed=true;setEngine('Offline / blocked','error');return;}
      if(data.type==='result'&&pending&&pending.id===data.id){const task=pending;pending=null;clearTimeout(task.timer);handleCodeResult(data,task.lessonId,task.check);}
    };
    pythonWorker.onerror=()=>{pythonFailed=true;setEngine('Engine unavailable','error');if(pending){clearTimeout(pending.timer);pending=null;state.running=false;updateRunButtons(false);toast('Python could not start. Check your internet connection.');}};
    pythonWorker.postMessage({type:'init'});
  } catch(error){pythonFailed=true;setEngine('Engine unavailable','error');}
}
function updateRunButtons(disabled){state.running=disabled;for(const id of ['run-btn','check-btn']){const btn=$(id);if(btn)btn.disabled=disabled;}showOutput();}
function runCode(check){
  const editor=$('code-editor');if(!editor||state.running)return;
  if(!pythonReady){toast(pythonFailed?'Python could not load. Connect to the internet and refresh.':'🐍 Python is still downloading. Try again in a moment.');return;}
  const lesson=LESSONS[state.active];state.output='> Running Python...';state.feedback=null;updateFeedback(null);updateRunButtons(true);
  const id=++requestId;
  const timer=setTimeout(()=>{if(pending&&pending.id===id){pending=null;updateRunButtons(false);state.output='';updateFeedback({kind:'no',message:'Your program took too long (10 seconds). Check for infinite loops. Python is restarting.'});startPython();}},10000);
  pending={id,timer,lessonId:lesson.id,check};pythonWorker.postMessage({type:'run',id,code:editor.value,tests:check?lesson.tests:''});
}
function handleCodeResult(result,lessonId,check){if(state.view!=='mission'||LESSONS[state.active].id!==lessonId)return;updateRunButtons(false);state.output=result.output||'(Program finished without printing anything.)';
 if(result.error){updateFeedback({kind:'no',message:result.error.replace(/Traceback \(most recent call last\):[\s\S]*?(?=(?:SyntaxError|IndentationError|NameError|TypeError|ValueError|ZeroDivisionError|RecursionError|ModuleNotFoundError|IndexError|KeyError|AttributeError|RuntimeError|ImportError):)/,'').trim()||result.error});return;}
 if(!check){updateFeedback({kind:'info',message:'Your code ran successfully! Click Check answer to see if it passes the mission tests.'});return;}
 completeLesson(LESSONS[state.active]);
}
// Event delegation keeps all controls active even when content is re-rendered.
document.addEventListener('click', async event=>{
  const button=event.target.closest('button');if(!button)return;
  if(button.hasAttribute('data-home')){$('overlay').innerHTML='';openHome();return;}
  if(button.hasAttribute('data-close-modal')){$('overlay').innerHTML='';return;}
  if(button.hasAttribute('data-next-modal')){const index=Number(button.dataset.nextModal);$('overlay').innerHTML='';openLesson(index);return;}
  if(button.hasAttribute('data-level')){openLevel(Number(button.dataset.level));return;}
  if(button.hasAttribute('data-mission')){openLesson(Number(button.dataset.mission));return;}
  if(state.view!=='mission')return;
  const lesson=LESSONS[state.active];
  if(button.hasAttribute('data-hint')){state.hintOpen=!state.hintOpen;render();return;}
  if(button.hasAttribute('data-solution')){state.solutionOpen=!state.solutionOpen;render();return;}
  if(button.hasAttribute('data-load-solution')){state.assisted[lesson.id]=true;state.drafts[lesson.id]=lesson.solution;persist();render();toast('Solution loaded. You can edit it and see how it works!');return;}
  if(button.hasAttribute('data-reset-code')){state.drafts[lesson.id]=lesson.starter;persist();const editor=$('code-editor');editor.value=lesson.starter;updateLines();editor.focus();toast('Editor reset to starter code.');return;}
  if(button.hasAttribute('data-copy-code')){try{await navigator.clipboard.writeText($('code-editor').value);toast('✓ Code copied!');}catch(_){toast('Copy blocked by this browser. Select the editor text to copy.');}return;}
  if(button.hasAttribute('data-run')){runCode(false);return;}
  if(button.hasAttribute('data-check')){runCode(true);return;}
  if(button.hasAttribute('data-option')){if(state.completed.has(lesson.id))return;state.selectedOption=Number(button.dataset.option);state.checked=false;state.feedback=null;render();return;}
  if(button.hasAttribute('data-submit-quiz')){checkQuiz();return;}
});
document.addEventListener('input',event=>{if(event.target.id==='code-editor'&&state.active!==null){state.drafts[LESSONS[state.active].id]=event.target.value;persist();updateLines();}});
document.addEventListener('scroll',event=>{if(event.target.id==='code-editor'&&$('line-numbers'))$('line-numbers').scrollTop=event.target.scrollTop;},true);
document.addEventListener('keydown',event=>{
 if(event.target.id==='code-editor'&&event.key==='Tab'){event.preventDefault();const el=event.target,start=el.selectionStart,end=el.selectionEnd;el.setRangeText('    ',start,end,'end');el.dispatchEvent(new Event('input',{bubbles:true}));}
 if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&state.view==='mission'&&LESSONS[state.active].type==='code'){event.preventDefault();runCode(false);}
});
render();startPython();
</script>
